<h3>Resultats exfiltrats:</h3>
<ul>
    {% for fila in incidents %}
        <li>
            <strong>ID:</strong> {{ fila.0 }} | 
            <strong>Usuari:</strong> {{ fila.1 }} | 
            <strong>Email:</strong> {{ fila.4 }}

    {% endfor %}
</ul>
