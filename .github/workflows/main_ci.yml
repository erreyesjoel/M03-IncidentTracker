name: Django Security CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    # HEM ELIMINAT EL PAS DE "Install System Dependencies" PERQUÈ JA HI SÓN
    
    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        # Instal·lem django, selenium i psycopg2-binary per si de cas
        pip install django selenium psycopg2-binary
        # Si tens requirements.txt, descomenta la línia següent:
        # pip install -r requirements.txt

    - name: Run Security Tests
      env:
        SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
        MOZ_HEADLESS: 1
      run: |
        python manage.py test core.tests_selenium